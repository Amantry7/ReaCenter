version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8008:8008"
    env_file:
      - .env
    volumes:
      - .:/app
      - static:/app/static
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8008 core.wsgi:application"

volumes:
  static: