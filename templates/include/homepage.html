{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реацентр</title>
    <!-- Performance: preconnect to CDN -->
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <!-- Preload primary font -->
    <link rel="preload" as="font" type="font/otf" href="{% static 'assets/font/Museo Sans Cyrl/museosanscyrl_100.otf' %}" crossorigin>
    <link rel="stylesheet" href="{% static 'assets/styles/style.css' %}">
    {% comment %} <link rel="stylesheet" href="{% static 'assets/styles/style2.css' %}"> {% endcomment %}
    <link rel="stylesheet" href="{% static 'assets/styles/swiper.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/styles/service_fixes.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/styles/mobile_animation_fixes.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/styles/brand_patterns.css' %}" />

</head>
<script>
    document.addEventListener("DOMContentLoaded", function () {
      new Swiper('.swiper-container-docs', {
        slidesPerView: 1.2,
        spaceBetween: 16,
        grabCursor: true,
        breakpoints: {
          640: { slidesPerView: 1.2 },
          768: { slidesPerView: 2 },
          1024: { slidesPerView: 3 },
        }
      });
    });
  </script>
<body>
    {% block content %}
    {% endblock %}
    <script src="{% static 'assets/js/script.js' %}" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js" defer></script>


</html>
